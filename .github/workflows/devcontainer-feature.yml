name: Dev container Feature

on:
  pull_request:
    paths:
      - "devcontainer-feature/**"
      - ".github/workflows/devcontainer-feature.yml"
  push:
    branches:
      - master
    paths:
      - "devcontainer-feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./devcontainer-feature/src"

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dev container CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Test host without dotfiles (default + without_dotfiles)
        run: devcontainer features test -p devcontainer-feature -f dotfiles --filter without_dotfiles
      - name: Test host with dotfiles (with_dotfiles)
        env:
          DOTFILES_UNTRACKED: ${{ github.workspace }}/devcontainer-feature/test/dotfiles/fixtures/untracked
        run: devcontainer features test -p devcontainer-feature -f dotfiles --skip-autogenerated --filter with_dotfiles

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./devcontainer-feature/src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
